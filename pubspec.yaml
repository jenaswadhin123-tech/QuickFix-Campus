name: voxguard_campus
description: Smart campus issue reporting and resolution.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.0
  firebase_auth: ^5.3.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  geolocator: ^13.0.2
  speech_to_text: ^7.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true